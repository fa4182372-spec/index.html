<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Telegram Coin Catcher</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: var(--tg-theme-bg-color, #18222d);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #gameCanvas {
            background: var(--tg-theme-secondary-bg-color, #131415);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            touch-action: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="ui">Score: <span id="score">0</span></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        // Initialize Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Expand game to full height

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        // Set responsive canvas dimensions
        const width = Math.min(window.innerWidth - 30, 400);
        const height = Math.min(window.innerHeight - 100, 600);
        canvas.width = width;
        canvas.height = height;

        let score = 0;
        let gameOver = false;

        // Player configuration
        const player = {
            x: width / 2 - 25,
            y: height - 40,
            w: 50,
            h: 15,
            color: tg.themeParams.button_color || '#0088cc'
        };

        // Falling Coins
        const coins = [];
        function createCoin() {
            coins.push({
                x: Math.random() * (width - 20) + 10,
                y: 0,
                radius: 10,
                speed: 2 + Math.random() * 3,
                color: '#ffd700'
            });
        }

        // Touch and Mouse Controls
        function movePlayer(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            player.x = clientX - rect.left - player.w / 2;

            // Constrain within bounds
            if (player.x < 0) player.x = 0;
            if (player.x + player.w > width) player.x = width - player.w;
        }

        canvas.addEventListener('mousemove', movePlayer);
        canvas.addEventListener('touchmove', movePlayer);

        // Main Game Loop
        let frameCount = 0;
        function update() {
            if (gameOver) return;

            frameCount++;
            if (frameCount % 40 === 0) createCoin();

            // Update coins
            for (let i = coins.length - 1; i >= 0; i--) {
                const c = coins[i];
                c.y += c.speed;

                // Check player collision
                if (
                    c.y + c.radius >= player.y &&
                    c.x >= player.x &&
                    c.x <= player.x + player.w
                ) {
                    score += 10;
                    scoreEl.innerText = score;
                    if (tg.HapticFeedback) {
                        tg.HapticFeedback.impactOccurred('light');
                    }
                    coins.splice(i, 1);
                    continue;
                }

                // Check bottom boundary (Game Over condition)
                if (c.y - c.radius > height) {
                    coins.splice(i, 1);
                }
            }

            draw();
            requestAnimationFrame(update);
        }

        // Render Game Objects
        function draw() {
            ctx.clearRect(0, 0, width, height);

            // Draw player
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.roundRect(player.x, player.y, player.w, player.h, 8);
            ctx.fill();

            // Draw coins
            coins.forEach(c => {
                ctx.fillStyle = c.color;
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        update();
    </script>
</body>
</html>
